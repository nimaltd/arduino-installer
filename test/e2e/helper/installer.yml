# What demo needs. CI installs it only as that, so it always lands in the
# libraries folder, even when demo goes into a sketch.

name: helper
description: Forty, for demo to build on
repository: https://github.com/nimaltd/arduino-installer
license: Apache-2.0

install:
  layout: mirror

files:
  headers:
    - src/helper.h
  sources:
    - src/helper.c
